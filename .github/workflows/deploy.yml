name: Deploy to GitHub Pages

# Builds the Vite app and publishes the static output to GitHub Pages.
# Firebase client config lives in src/firebase.js as plain strings
# (web API keys are not secrets — security is enforced by Firestore
# rules), so this workflow doesn't need any repo secrets.
#
# One-time setup (see README):
#   1. Repo -> Settings -> Pages -> Source = GitHub Actions
#   2. Firebase Console -> Authentication -> Settings ->
#      Authorized domains, add <user>.github.io

on:
  push:
    branches: [main, master, claude/prayer-request-app-xp185]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
